server.port=8080
spring.application.name=finshield-monolith

# Default Data Source (H2 in-memory for zero-friction local run; switch to MySQL for production)
spring.datasource.url=jdbc:h2:mem:finshield_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Redis Configuration (Optional local or container)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# High-Value Maker-Checker Threshold (Transactions > 100,000 INR require dual-authorization)
finshield.maker-checker.threshold=100000.00

# AI ML Sidecar URL
finshield.ml.fraud-service-url=http://localhost:8000

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql